# ------------------------------------------------------------------
# CI — the quality robot.
# Every push and pull request gets: typecheck → build → saved copy.
# ------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # 22 = maintenance LTS · 24 = active LTS (2026)
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the parts (exact versions from the lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm run test:run

      - name: Build the studio
        run: npm run build

      - name: Keep a copy of the build (main branch only)
        if: github.ref == 'refs/heads/main' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
