# ------------------------------------------------------------------
# Pages — publishes the studio to GitHub Pages on every push to main.
#
# One-time setup (repo owner):
#   Settings → Pages → "Build and deployment" → Source: GitHub Actions
# ------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Relative asset paths so the site works on any Pages URL or domain.
      - name: Build (relative base)
        run: npm run build -- --base=./

      - name: Prepare Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
