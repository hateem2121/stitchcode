# ------------------------------------------------------------------
# Release — tag a version (e.g. v1.2.3) and the robot:
#   1. builds the studio,
#   2. creates platform-specific packages (Windows .exe, macOS .dmg, Linux .AppImage),
#   3. publishes a GitHub Release with all artifacts attached.
# ------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electron:
    name: Build Electron packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Build Electron packages
        run: npx electron-builder --${{ matrix.os == 'windows-latest' && 'win' || matrix.os == 'macos-latest' && 'mac' || 'linux' }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: dist-electron/
          retention-days: 7

  release:
    name: Publish release
    needs: build-electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Zip the site
        run: |
          cd dist
          zip -r ../stitchcode-${{ github.ref_name }}.zip .

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-windows-*
          merge-multiple: true
          path: releases/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-macos-*
          merge-multiple: true
          path: releases/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-ubuntu-*
          merge-multiple: true
          path: releases/

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stitchcode-${{ github.ref_name }}.zip
            releases/*.exe
            releases/*.dmg
            releases/*.AppImage
            releases/*.deb
            releases/*.rpm
