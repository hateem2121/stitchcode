# RUN STITCHCODE — nginx settings for the Docker image.
#
# NOTE on add_header: a location-level add_header suppresses EVERY inherited
# add_header (nginx inheritance rule). That bug previously stripped the
# security headers from index.html and all assets. Fix: no location uses
# add_header — cache policy comes from the map below, so the server-level
# security headers apply to every response.

map $uri $cache_control {
    default                  "no-cache";
    # only /assets/* is fingerprinted — everything else (sw.js, manifest,
    # icons, index.html) is unhashed and must revalidate
    ~*^/assets/              "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The studio is a single-page app: any path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Squash text on the way out — pages travel smaller
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header Cache-Control $cache_control always;

    # Security headers (OWASP 2026 baseline for a static SPA)
    # · script-src has NO 'unsafe-inline' — the build emits no inline scripts
    # · style-src keeps 'unsafe-inline' (Vite style injection needs it)
    # · frame-ancestors works here because this is a real header, not a meta tag
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
}
