# RUN STITCHCODE — nginx settings for the Docker image
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The studio is a single-page app: any path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Squash text on the way out — pages travel smaller
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted assets may be cached for a year; the page itself never
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Comprehensive security headers (OWASP 2026 best practices)
    # Content Security Policy: strict but allows inline scripts for the SPA architecture
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Prevent clickjacking attacks
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable deprecated web features (no hardware access needed)
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
}
