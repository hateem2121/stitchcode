<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RUN STITCHCODE — a 100% offline QR code studio. Stitch a logo into the matrix, proof it on real print materials, and export crisp PNG or vector SVG."
    />
    <title>RUN STITCHCODE — QR Code Studio</title>
    <meta name="theme-color" content="#1c1c1a" />
    
    <!-- Security meta tag (defense in depth with the nginx/Electron CSP
         headers; frame-ancestors is header-only per the CSP spec, so it is
         not repeated here). The dev server relaxes this via a Vite plugin. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; object-src 'none';" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="RUN STITCHCODE — QR Code Studio" />
    <meta
      property="og:description"
      content="Build spec-safe QR codes in your browser. Stitch or inlay a logo into the matrix, proof it on real substrates, and export SVG / PNG — 100% offline."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:url" content="https://run-apparel.github.io/stitchcode/" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/RUN-APPAREL/stitchcode/main/docs/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RUN STITCHCODE — QR Code Studio logo" />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/RUN-APPAREL/stitchcode/main/docs/assets/og-image.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C1C1A'/%3E%3Cpath fill='%23F0EEDF' d='M6 6h8v8H6zm2 2v4h4V8zm10-2h8v8h-8zm2 2v4h4V8zM6 18h8v8H6zm2 2v4h4v-4zm12-2h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm4 0h2v2h-2zm0 4h2v2h-2zm-4 0h2v2h-2z'/%3E%3Crect x='20' y='20' width='4' height='4' fill='%23FE492A'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font: 14px/1.6 system-ui, sans-serif; max-width: 34rem; margin: 4rem auto; padding: 0 1.5rem;">
        <h1>RUN STITCHCODE needs JavaScript</h1>
        <p>
          This QR code studio runs entirely in your browser, which requires JavaScript.
          Nothing is ever uploaded — with JavaScript on, every code you make stays on
          your device.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
